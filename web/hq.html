<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本部：報告の確認</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: 15px; }
  .hq { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 46px); }
  .side { background: #eef2f5; border-right: 1px solid var(--line); padding: 10px; }
  .tabs button {
    display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px;
    border-radius: 6px; cursor: pointer; font-size: 15px;
  }
  .tabs button.on { background: var(--navy); color: #fff; }
  .tabs .count { float: right; }
  .items { margin-top: 10px; }
  .item { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 6px; cursor: pointer; font-size: 14px; }
  .item.on { border: 2px solid var(--blue); }
  .main { padding: 14px 20px 40px; max-width: 1100px; }
  .main h2 { margin-top: 0; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .facts div span { color: #667; font-size: 13px; margin-right: 4px; }
  .place { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .place .lbl { font-weight: bold; color: var(--navy); margin-bottom: 6px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cols img, .others img { width: 100%; border-radius: 6px; display: block; cursor: zoom-in; }
  .cap { font-size: 13px; color: #445; margin: 2px 0 8px; }
  .cap.unknown { color: var(--red); font-weight: bold; }
  .others { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .actions .btn { flex: 1; }
  .log { font-size: 13px; color: #556; margin-top: 16px; }
  .form { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; max-width: 560px; margin-bottom: 16px; }
  table.grid { border-collapse: collapse; width: 100%; background: #fff; font-size: 14px; }
  table.grid th, table.grid td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; }
  table.grid th { background: #e8f0f6; }
  .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 40; cursor: zoom-out; }
  .zoom img { max-width: 96vw; max-height: 96vh; }
  @media (max-width: 760px) { .hq { grid-template-columns: 1fr; } .side { border-right: 0; } .others { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header class="top"><h1>XOP 業務ポータル　本部：施工完了報告の確認</h1><span id="who"></span></header>
<div class="hq">
  <aside class="side">
    <div class="tabs" id="tabs"></div>
    <div class="items" id="items"></div>
  </aside>
  <section class="main" id="main"><div class="spinner">読み込んでいます…</div></section>
</div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="hq.js"></script>
</body>
</html>
